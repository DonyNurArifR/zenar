site_name: Zenar
site_description: Embedded vector database for Python with typed metadata filtering
site_url: https://donynurarifr.github.io/zenar/
repo_url: https://github.com/DonyNurArifR/zenar
repo_name: DonyNurArifR/zenar
docs_dir: docs
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Introduction: index.md
  - API reference: API.md
  - Filtering: FILTERING.md
  - Storage and recovery: STORAGE.md
  - Architecture: ARCHITECTURE.md
  - Benchmarks: BENCHMARKS.md
  - Contributing: CONTRIBUTING.md
