name: Feature request
description: Suggest an addition or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Include an example call if it helps.
  - type: checkboxes
    id: scope
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues first.
          required: true
