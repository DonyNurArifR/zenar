name: CI

# Documentation-only changes do not run CI, to save free-plan minutes.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".github/ISSUE_TEMPLATE/**", ".github/pull_request_template.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", ".github/ISSUE_TEMPLATE/**", ".github/pull_request_template.md"]

jobs:
  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.89.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --locked -p zenar-core
      - name: Format and lint (warnings are errors)
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install maturin
      - run: maturin build --release --locked --out dist
      # Test the built wheel in a fresh venv, the way users install it.
      - shell: bash
        run: |
          python -m venv .venv-test
          if [ -d .venv-test/Scripts ]; then PY=.venv-test/Scripts/python; else PY=.venv-test/bin/python; fi
          "$PY" -m pip install --quiet dist/*.whl pytest numpy
          "$PY" -m pytest -q
      # The type stubs must match the compiled module.
      - name: Type stubs match the module
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          .venv-test/bin/python -m pip install --quiet mypy
          .venv-test/bin/python -m mypy.stubtest zenar._zenar --allowlist tests/stubtest_allowlist.txt

  supply-chain:
    name: Audit and license check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check licenses advisories bans
