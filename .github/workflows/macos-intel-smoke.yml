# Manual smoke test on an Intel macOS runner. It builds the wheel natively on Intel (not cross-compiled), installs it,
# and runs the Python test suite against the installed wheel. Start it with:
#   gh workflow run macos-intel-smoke.yml --ref <branch>
# macos-15-intel is an Intel (x86_64) hosted runner. The label is checked by the first dispatch.
name: macOS Intel smoke (manual)

on:
  workflow_dispatch:
  # Runs from this branch only, and only when this file changes. Dispatching needs the file on the default
  # branch, which it is not, so the first run comes from the push that adds this trigger.
  push:
    branches: [docs-index-atomicity]
    paths: [".github/workflows/macos-intel-smoke.yml"]

permissions:
  contents: read

jobs:
  smoke:
    name: Build and test on Intel macOS
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Confirm the architecture
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.89"
      - name: Build the wheel on this runner
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --locked --out dist
      - name: Install the wheel and test it
        run: |
          python -m pip install --find-links dist zenar pytest numpy jsonschema
          python -c "import zenar, platform; print(zenar.__file__, platform.machine())"
          python -m pytest -q tests
