# cargo-deny policy (spec section 84). Run: cargo deny check licenses advisories bans

[advisories]
yanked = "deny"
ignore = [
    # `paste` is unmaintained but not vulnerable. It is pulled in transitively by
    # turbovec -> statrs -> nalgebra -> simba. No safe upgrade exists. Remove when
    # turbovec moves off it.
    { id = "RUSTSEC-2024-0436", reason = "transitive via turbovec; no safe upgrade available" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
