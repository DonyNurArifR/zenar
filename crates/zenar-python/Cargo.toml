[package]
name = "zenar-python"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[lib]
name = "_zenar"
crate-type = ["cdylib", "rlib"]

[dependencies]
zenar-core = { version = "0.1.2", path = "../zenar-core" }
chrono = "0.4"
serde_json = "1"
pyo3 = { version = "0.29", features = ["abi3-py310"] }

[features]
# Enabled by maturin for wheels. Leaves Python symbols to the interpreter, so a
# plain `cargo build` of the workspace links (see docs/CONTRIBUTING.md).
extension-module = ["pyo3/extension-module"]
# Test-only hook that raises a panic inside a guarded call. Off in every shipped wheel; CI builds
# one with it on to check the panic guard.
test-hooks = []
