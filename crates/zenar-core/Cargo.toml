[package]
name = "zenar-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[dependencies]
turbovec = "=1.1.2"
# default-features off: the default `cli` feature pulls in terminal tooling Zenar does not use
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = "0.4"
